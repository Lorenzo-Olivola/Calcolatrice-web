<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcolatrice</title>
    <link rel="stylesheet" href="style.css" type="text/css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="calcolatrice">
        <div class="display">
            <input type="text" id="display" disabled>
        </div>
        <div class="tastiera">
            <button class="btn" onclick="inserisciOperatore('/')">/</button>
            <button class="btn" onclick="inserisciNumero('7')">7</button>
            <button class="btn" onclick="inserisciNumero('8')">8</button>
            <button class="btn" onclick="inserisciNumero('9')">9</button>
            <button class="btn" onclick="inserisciOperatore('+')">+</button>
            <button class="btn" onclick="inserisciNumero('4')">4</button>
            <button class="btn" onclick="inserisciNumero('5')">5</button>
            <button class="btn" onclick="inserisciNumero('6')">6</button>
            <button class="btn" onclick="inserisciOperatore('-')">-</button>
            <button class="btn" onclick="inserisciNumero('1')">1</button>
            <button class="btn" onclick="inserisciNumero('2')">2</button>
            <button class="btn" onclick="inserisciNumero('3')">3</button>
            <button class="btn" onclick="inserisciOperatore('*')">*</button>
            <button class="btn" onclick="cancella()">C</button>
            <button class="btn" onclick="inserisciNumero('0')">0</button>
            <button class="btn" onclick="calcola()">=</button>
        </div>
    </div>
</body>

</html>
